type: markdown
content: |
  ## Waarheidstabellen

  **XOR**

  | A | B | Uitgang |
  |---|---|---|
  | UIT | UIT | UIT |
  | AAN | UIT | AAN |
  | UIT | AAN | AAN |
  | AAN | AAN | UIT |

  **NOT**

  | Ingang | Uitgang |
  |---|---|
  | UIT | AAN |
  | AAN | UIT |













    
